spring:
  application:
    name: tcc2-reactive
  main:
    web-application-type: reactive
  threads:
    virtual:
      enabled: false
  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:tcc2}
    username: ${POSTGRES_USER:tcc2}
    password: ${POSTGRES_PASSWORD:tcc2_local}
    pool:
      enabled: true
      initial-size: ${DB_POOL_MAX_SIZE:10}
      max-size: ${DB_POOL_MAX_SIZE:10}
      max-acquire-time: 15s
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      accept-float-as-int: false
server:
  port: ${SERVER_PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,r2dbc
          show-components: always
tcc:
  io:
    database-delay: ${IO_DATABASE_DELAY:0ms}
  cpu:
    iterations: ${CPU_ITERATIONS:200000}
    execution-mode: ${CPU_EXECUTION_MODE:event-loop}
  mixed:
    cpu-iterations: ${MIXED_CPU_ITERATIONS:10000}
    cpu-execution-mode: ${MIXED_CPU_EXECUTION_MODE:event-loop}
